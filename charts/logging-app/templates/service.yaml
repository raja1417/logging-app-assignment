apiVersion: v1
kind: Service
metadata:
  name: hotel-logging-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "logging-app.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "logging-app.labels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
  type: {{ .Values.service.type }}
