{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "logging-app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "logging-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "logging-app.labels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.app.port }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 8088
    - ports:
        - protocol: TCP
          port: 443
{{- end }}
