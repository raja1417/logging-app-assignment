apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logging-app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "logging-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "logging-app.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "logging-app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "logging-app.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "logging-app.labels" . | nindent 14 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "logging-app.labels" . | nindent 20 }}
      containers:
        - name: hotel-logging-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            - name: LOG_FILE
              value: "/var/log/app/app.log"
            - name: LOG_SAMPLE_RATE
              value: {{ .Values.app.logSampleRate | quote }}
            - name: LOG_MAX_PER_WINDOW
              value: {{ .Values.app.logMaxPerWindow | quote }}
            - name: LOG_WINDOW_MS
              value: {{ .Values.app.logWindowMs | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

        - name: fluent-bit-logger
          image: "{{ .Values.fluentBit.image.repository }}:{{ .Values.fluentBit.image.tag }}"
          imagePullPolicy: {{ .Values.fluentBit.image.pullPolicy }}
          env:
            - name: SPLUNK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: splunk-secret
                  key: SPLUNK_TOKEN
            - name: SPLUNK_HEC_HOST
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-config
                  key: splunk_hec_host
            - name: SPLUNK_HEC_PORT
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-config
                  key: splunk_hec_port
            - name: SPLUNK_HEC_TLS
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-config
                  key: splunk_hec_tls
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            {{- toYaml .Values.fluentBit.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
            - name: logs
              mountPath: /var/log/app
              readOnly: true
            - name: fluent-bit-storage
              mountPath: /fluent-bit/storage
          livenessProbe:
            exec:
              command: ["pgrep", "fluent-bit"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-config
        - name: fluent-bit-storage
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
