apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "logging-app.labels" . | nindent 4 }}
data:
  splunk_hec_host: {{ .Values.splunk.hecHost | quote }}
  splunk_hec_port: {{ .Values.splunk.hecPort | quote }}
  splunk_hec_tls: {{ .Values.splunk.hecTls | quote }}
  fluent-bit.conf: |
    [SERVICE]
        Flush              5
        Daemon             Off
        Log_Level          info
        Parsers_File       parsers.conf
        HTTP_Server        On
        HTTP_Listen        0.0.0.0
        HTTP_Port          2020
        storage.path       /fluent-bit/storage
        storage.sync       normal
        storage.max_chunks_up 128
        storage.backlog.mem_limit 5M

    [INPUT]
        Name                tail
        Path                /var/log/app/*.log
        Path_Key            source_file
        Tag                 hotel.app
        Parser              json_app
        Mem_Buf_Limit        5MB
        Skip_Long_Lines      On
        Refresh_Interval     5
        multiline.parser     app_multiline

    [FILTER]
        Name                modify
        Match               hotel.app
        Add                 k8s_pod_name ${POD_NAME}
        Add                 k8s_namespace ${POD_NAMESPACE}
        Add                 k8s_node_name ${NODE_NAME}

    [FILTER]
        Name          record_modifier
        Match         hotel.app
        Record        service apache_web

    [FILTER]
        Name          grep
        Match         hotel.app
        Exclude       level ^(debug|10|20)$

    [FILTER]
        Name          throttle
        Match         hotel.app
        Rate          {{ .Values.fluentBit.throttle.rate }}
        Window        {{ .Values.fluentBit.throttle.window }}
        Interval      1s
        Print_Status  true

    [OUTPUT]
        Name              splunk
        Match             hotel.app
        Host              ${SPLUNK_HEC_HOST}
        Port              ${SPLUNK_HEC_PORT}
        TLS               ${SPLUNK_HEC_TLS}
        TLS.Verify        Off
        Splunk_Token      ${SPLUNK_TOKEN}
        Splunk_Send_Raw   On
        Retry_Limit       5
        storage.total_limit_size 50M

    [OUTPUT]
        Name    stdout
        Match   hotel.app
        Format  json_lines

  parsers.conf: |
    [PARSER]
        Name        json_app
        Format      json
        Time_Key    ts
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep   On

    [MULTILINE_PARSER]
        Name          app_multiline
        Type          regex
        Flush_Timeout 1000
        Rule          "start_state"  "/^\{.*/"        "cont"
        Rule          "cont"         "/^[^\{].*/"     "cont"

    [PARSER]
        Name   apache
        Format regex
        Regex  ^(?<log_level>[A-Z]+)\s+(?<log_source>[^\:]+):\s+(?<log_message>.+)$
        Time_Key log_time
        Time_Format %Y-%m-%dT%H:%M:%S
