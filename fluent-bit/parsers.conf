[PARSER]
    Name        json_app
    Format      json
    Time_Key    ts
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On

[MULTILINE_PARSER]
    Name          app_multiline
    Type          regex
    Flush_Timeout 1000
    # A new record starts with a line beginning with "{" (a fresh JSON log
    # line); anything else (e.g. a stack trace continuation) is appended to
    # the previous record instead of becoming its own log line.
    Rule          "start_state"  "/^\{.*/"        "cont"
    Rule          "cont"         "/^[^\{].*/"     "cont"

# Retained for backwards compatibility with the original Apache access-log
# based pipeline (docker/Dockerfile.webserver no longer produces this
# format, but external log shippers may still rely on it).
[PARSER]
    Name   apache
    Format regex
    Regex  ^(?<log_level>[A-Z]+)\s+(?<log_source>[^\:]+):\s+(?<log_message>.+)$
    Time_Key log_time
    Time_Format %Y-%m-%dT%H:%M:%S
