[SERVICE]
    Flush              5
    Daemon             Off
    Log_Level          info
    Parsers_File       parsers.conf
    HTTP_Server        On
    HTTP_Listen        0.0.0.0
    HTTP_Port          2020
    storage.path       /fluent-bit/storage
    storage.sync       normal
    storage.max_chunks_up 128
    storage.backlog.mem_limit 5M

# The Node.js app writes one structured JSON line per request to stdout,
# which container runtimes persist under /var/log/containers or
# /var/log/app depending on the platform. In Kubernetes this file is
# supplied by the kubelet; for docker-compose we tail the file the app
# writes directly via the shared "logs" volume (see docker-compose.yaml).
[INPUT]
    Name                tail
    Path                /var/log/app/*.log
    Path_Key            source_file
    Tag                 hotel.app
    Parser              json_app
    Mem_Buf_Limit        5MB
    Skip_Long_Lines      On
    Refresh_Interval     5
    multiline.parser     app_multiline

# Kubernetes metadata enrichment. Rather than calling the Kubernetes API
# (which requires the tag to encode namespace/pod/container in the exact
# kubelet log-file naming scheme), we cheaply stamp pod/namespace metadata
# from the Downward API env vars injected by the Deployment. This works
# identically in docker-compose (falls back to "local"/"default") and in
# Kubernetes, with zero extra API calls or resource overhead.
[FILTER]
    Name                modify
    Match               hotel.app
    Add                 k8s_pod_name ${POD_NAME}
    Add                 k8s_namespace ${POD_NAMESPACE}
    Add                 k8s_node_name ${NODE_NAME}

[FILTER]
    Name          record_modifier
    Match         hotel.app
    Record        service apache_web

# Drop noisy DEBUG-level lines before they ever reach the throttle/output
# stage -- the biggest single win for reducing log volume.
[FILTER]
    Name          grep
    Match         hotel.app
    Exclude       level ^(debug|10|20)$

# Protect downstream systems (and this node's CPU/memory) from bursts of
# traffic by capping the sustained rate of log records per Flush interval.
[FILTER]
    Name          throttle
    Match         hotel.app
    Rate          1000
    Window        5
    Interval      1s
    Print_Status  true

[OUTPUT]
    Name              splunk
    Match             hotel.app
    Host              ${SPLUNK_HEC_HOST}
    Port              ${SPLUNK_HEC_PORT}
    TLS               ${SPLUNK_HEC_TLS}
    TLS.Verify        Off
    Splunk_Token      ${SPLUNK_TOKEN}
    Splunk_Send_Raw   On
    Retry_Limit       5
    storage.total_limit_size 50M

# Always mirror to stdout as well, so `docker compose logs` / `kubectl logs`
# show what is being forwarded -- invaluable for local debugging.
[OUTPUT]
    Name    stdout
    Match   hotel.app
    Format  json_lines
